[package] #
name = "client"
version = "0.1.2"
edition = "2024"

[dependencies]
bevy = "0.20.0"
noise = "0.9"
fastrand = "2.3"
avian3d = "0.8.0"

bevy_asset_loader = {version = "0.28.1", features = ["3d"]}

serde = { version = "1.0.228", features = ["derive"] }
rand = "0.10.0"
message-io = { version = "0.19.0", optional = true }
shared = { path = "../shared", features = ["render"] }
server = { path = "../server", optional = true }
postcard = { version = "1.1.3", features = ["use-std", "alloc"] }

bevy-inspector-egui = { version = "0.38.0", optional = true }
clap = { version = "4.5.58", features = ["derive", "env"] }
dashmap = "6.1.0"
arboard = { version = "3.6.1", optional = true }
bevy-steamworks = { git = "https://github.com/extrawurst/bevy_steamworks", rev = "8882c209c8e6d2ecb318a0ec60446109700c9ceb", optional = true }

raw-window-handle = { version = "0.6.2", optional = true }
wasm-bindgen = { version = "0.2.108", optional = true }
# transitive dependency feature flag required for web: getrandom/wasm_js
getrandom = { version = "0.4.1", optional = true, features = ["wasm_js"] }
web-sys = { version = "0.3.85", optional = true, features = [
"Window", "Document", "HtmlCanvasElement", "HtmlParagraphElement", "console",
"MessageEvent", "WebSocket", "PresentationConnection", "Blob", "ReadableStream", "ReadableStreamDefaultReader"
] }
wasm-bindgen-futures = {version = "0.4.58", optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] , optional = true }
futures = { version = "0.3.32", optional = true }
serde_json = "1.0.149"

# main.rs drives every non-web build with a tokio runtime, so tokio has to be
# present on native targets regardless of which networking features are enabled.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.49.0" }

[features]
inspector = ["dep:bevy-inspector-egui"]
singleplayer = ["dep:server"]
web = ["dep:wasm-bindgen", "dep:raw-window-handle", "dep:web-sys", "shared/web", "dep:getrandom", "dep:wasm-bindgen-futures"]
udp = ["shared/udp", "dep:message-io"]
steam = ["dep:bevy-steamworks", "dep:futures", "dep:reqwest"]
clipboard = ["dep:arboard"]
default = ["steam", "udp", "clipboard"]
